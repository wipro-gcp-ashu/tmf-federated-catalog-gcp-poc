# ==============================================================================
# TM Forum ODA Federated Catalog & Inventory Microservices (GKE Deployment)
# ==============================================================================
# Exposes live REST endpoints inside GKE namespace 'tmf-federated-catalog':
#   - TMF620 Product Catalog (TMFC001): /tmf-api/productCatalogManagement/v4/productOffering
#   - TMF633 Service Catalog (TMFC006): /tmf-api/serviceCatalogManagement/v4/serviceSpecification
#   - TMF634 Resource Catalog (TMFC007): /tmf-api/resourceCatalog/v4/resourceSpecification
#   - TMF638 Service Inventory (TMFC008): /tmf-api/serviceInventory/v4/service
#   - TMF639 Resource Inventory (TMFC011): /tmf-api/resourceInventoryManagement/v4/resource
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: tmf-federated-catalog
  labels:
    oda.tmforum.org/block: "core-commerce-and-production"
    oda.tmforum.org/federated-catalog: "enabled"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmf-federated-catalog-api
  namespace: tmf-federated-catalog
  labels:
    app: tmf-federated-catalog-api
    oda.tmforum.org/components: "TMFC001-TMFC006-TMFC007-TMFC008-TMFC011"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tmf-federated-catalog-api
  template:
    metadata:
      labels:
        app: tmf-federated-catalog-api
    spec:
      containers:
        - name: tmf-openapi-server
          image: python:3.11-alpine
          ports:
            - containerPort: 8080
              name: http-tmf-api
          volumeMounts:
            - name: catalog-payloads
              mountPath: /data/catalogs
          command: ["python3", "-c"]
          args:
            - |
              import http.server, json, os
              from pathlib import Path

              DATA_DIR = Path("/data/catalogs")

              class TMFHandler(http.server.BaseHTTPRequestHandler):
                  def _send(self, code, payload):
                      body = json.dumps(payload, indent=2).encode("utf-8")
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def _load(self, name, default):
                      p = DATA_DIR / name
                      if p.exists():
                          return json.loads(p.read_text(encoding="utf-8"))
                      return default

                  def do_GET(self):
                      if self.path.startswith("/health"):
                          self._send(200, {"status": "UP", "odaCanvas": "v1beta2", "apis": ["TMF620", "TMF633", "TMF634", "TMF638", "TMF639"]})
                      elif self.path.startswith("/tmf-api/productCatalogManagement/v4"):
                          self._send(200, self._load("tmf620.json", []))
                      elif self.path.startswith("/tmf-api/serviceCatalogManagement/v4"):
                          self._send(200, self._load("tmf633.json", []))
                      elif self.path.startswith("/tmf-api/resourceCatalog/v4"):
                          self._send(200, self._load("tmf634.json", []))
                      elif self.path.startswith("/tmf-api/serviceInventory/v4"):
                          self._send(200, self._load("tmf638.json", {"services": []}))
                      elif self.path.startswith("/tmf-api/resourceInventoryManagement/v4"):
                          self._send(200, self._load("tmf639.json", {"resources": []}))
                      else:
                          self._send(200, {
                              "federatedCatalogGateway": "Active",
                              "endpoints": [
                                  "/tmf-api/productCatalogManagement/v4/productOffering",
                                  "/tmf-api/serviceCatalogManagement/v4/serviceSpecification",
                                  "/tmf-api/resourceCatalog/v4/resourceSpecification",
                                  "/tmf-api/serviceInventory/v4/service",
                                  "/tmf-api/resourceInventoryManagement/v4/resource"
                              ]
                          })

              http.server.HTTPServer(("0.0.0.0", 8080), TMFHandler).serve_forever()
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      volumes:
        - name: catalog-payloads
          configMap:
            name: tmf-federated-catalog-store
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: tmf-federated-catalog-svc
  namespace: tmf-federated-catalog
  labels:
    app: tmf-federated-catalog-api
spec:
  selector:
    app: tmf-federated-catalog-api
  ports:
    - name: http-tmf-api
      port: 8080
      targetPort: 8080
